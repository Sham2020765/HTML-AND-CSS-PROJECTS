<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pet Shop</title>
  <!-- Fixed CSS path pointing one folder up to root css folder -->
  <link rel="stylesheet" href="../css/style1.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="navbar">
      <div class="logo"><h2>Welcome to The Pet Shop</h2></div>
      <ul>
        <li><a href="#dogs">Dogs</a></li>
        <li><a href="#cats">Cats</a></li>
        <li><a href="#fish">Fish</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Website Content & Gallery -->
  <main style="padding: 20px; text-align: center;">
    <h1>Our Gallery</h1>
    <p>Click any pet image below to view it in the required lightbox modal.</p>
    
    <div class="gallery" style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px;">
      <!-- Fixed image paths pointing one folder up to your root images -->
      <div id="dogs">
        <h3>Dogs</h3>
        <img src="../dog.png" alt="Dog" style="width:200px; height:200px; object-fit:cover; border-radius:8px;">
      </div>
      
      <div id="cats">
        <h3>Cats</h3>
        <img src="../cat.png" alt="Cat" style="width:200px; height:200px; object-fit:cover; border-radius:8px;">
      </div>
      
      <div id="fish">
        <h3>Fish</h3>
        <img src="../fish.png" alt="Fish" style="width:200px; height:200px; object-fit:cover; border-radius:8px;">
      </div>
    </div>
  </main>

  <!-- The required script file linked at the very bottom -->
  <script src="script.js"></script>
</body>
</html>
