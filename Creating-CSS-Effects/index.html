<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Effects</title>
    
    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Poppins', sans-serif; 
            gap: 30px;
        }

        /* Your Original Box Effect */
        .box {
            width: 200px;
            height: 200px;
            background-color: #007bff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        .box:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background-color: #0056b3;
        }

        /* Image Hover Effect Required by Instructor */
        .image-container {
            width: 250px;
            height: 250px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-container:hover img {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <h2>CSS Effects & Google Fonts</h2>

    <!-- Your original element -->
    <div class="box">Hover Me!</div>

    <!-- Required Image Element with Hover Effect -->
    <div class="image-container">
        <img src="../beardedDragon.png" alt="Bearded Dragon">
    </div>

</body>
</html>
